apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
      - name: node-backend
        image: boughanmiasma/template-vite-react-node-postgres-master-backend:v0.1
        env:
          - name: DATABASE_URL
            valueFrom: 
              secretKeyRef:
                name: postgres-secret
                key: database-url

        ports:
        - containerPort: 5000
--- 
apiVersion: v1
kind: Service
metadata:
  name: backend-service
spec:
  type: NodePort
  selector:
    app: backend
  ports:
    - protocol: TCP
      port: 5000
      targetPort: 5000
      nodePort: 30010
